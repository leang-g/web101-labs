<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Number Checker</title>
    <style>
        /* --- CSS Styling --- */
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --light-gray: #f8f9fa;
            --dark-gray: #343a40;
            --white: #ffffff;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--light-gray);
        }

        .checker-card {
            background-color: var(--white);
            padding: 2rem 2.5rem;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 420px;
            border-top: 5px solid var(--primary-color);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
            color: var(--dark-gray);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        #numberInput {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ced4da;
            border-radius: var(--border-radius);
            font-size: 1rem;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }

        #numberInput::placeholder {
            color: #999;
        }

        #checkBtn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            background-color: var(--primary-color);
            color: var(--white);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        #checkBtn:hover {
            background-color: #0056b3;
        }

        #checkBtn:active {
            transform: scale(0.98);
        }

        .result-area {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: var(--border-radius);
            min-height: 1.5em;
            font-weight: 500;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .result-area.success {
            background-color: #e9f7ec;
            color: var(--success-color);
        }

        .result-area.error {
            background-color: #fdeeee;
            color: var(--error-color);
        }
    </style>
</head>
<body>

    <main class="checker-card">
        <h1>Palindrome Number Checker</h1>
        <div class="input-group">
            <input type="text" id="numberInput" placeholder="Enter a number" inputmode="numeric">
            <button id="checkBtn">Check</button>
        </div>
        <p id="result" class="result-area"></p>
    </main>

    <script src="palindrome-app.js"></script>
</body>
</html>
