<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number to String Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="converter-card">
        <h1>Number to string converter</h1>
        <div class="input-group">
            <input type="text" id="numberInput" placeholder="Enter number" inputmode="numeric">
            <button id="convertBtn">Convert</button>
        </div>
        <p id="output" class="output-area"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
